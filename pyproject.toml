[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepdive-agent-arena"
version = "1.0.0"
description = "DeepDive: a self-verifying multi-agent research and claim-entailment system (Agent Arena 2026, Track 01)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openai>=1.40,<3.0",
    "langgraph>=0.2.60",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "chromadb>=0.5",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tavily-python>=0.5",
    "duckduckgo-search>=6.0",
    "pypdf>=4.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["src*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["src", "eval", "tests"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^\\.venv/", "^data/"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "live: hits real Mesh/Tavily endpoints (skipped unless DEEPDIVE_LIVE_TESTS=1)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning:duckduckgo_search.*",
]
