<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepDive · Self-Verifying Research</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script nonce="{{ csp_nonce }}">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'], mono: ['JetBrains Mono', 'ui-monospace', 'monospace'] },
          colors: {
            ink: { 950: '#07090d', 900: '#0b0e14', 850: '#0f131b', 800: '#131823', 700: '#1b2230', 600: '#263042', 500: '#3a4559' },
          },
        },
      },
    };
  </script>
  <style>
    :root { color-scheme: dark; }
    body { background: radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,.10), transparent 60%), #07090d; }
    .panel { background: rgba(15,19,27,.86); border: 1px solid #1b2230; border-radius: 14px; }
    .panel-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8b93a7; font-weight: 600; }
    .node { transition: all .25s ease; }
    .node[data-state="active"] { border-color: #6366f1; box-shadow: 0 0 0 1px #6366f1, 0 0 28px rgba(99,102,241,.35); }
    .node[data-state="active"] .dot { background: #818cf8; animation: pulse 1.1s infinite; }
    .node[data-state="done"] { border-color: rgba(16,185,129,.55); }
    .node[data-state="done"] .dot { background: #10b981; }
    .node[data-state="failed"] { border-color: #f43f5e; }
    .node[data-state="failed"] .dot { background: #f43f5e; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .35; transform: scale(.8) } }
    #loopPath { stroke-dasharray: 6 6; }
    #loopPath.firing { stroke: #a78bfa; animation: dash 0.8s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .chip { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: rgba(99,102,241,.14); color: #a5b4fc; border: 1px solid rgba(99,102,241,.3); cursor: pointer; white-space: nowrap; }
    .chip:hover { background: rgba(99,102,241,.28); }
    .tab[aria-selected="true"] { color: #e6e9ef; border-color: #6366f1; }
    .scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #263042; border-radius: 8px; }
    mark.q-SUPPORTED { background: rgba(16,185,129,.22); color: inherit; border-bottom: 1px solid #10b981; }
    mark.q-CONTRADICTED { background: rgba(244,63,94,.22); color: inherit; border-bottom: 1px solid #f43f5e; }
    mark.q-UNSUPPORTED { background: rgba(245,158,11,.18); color: inherit; border-bottom: 1px solid #f59e0b; }
    .fade-in { animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(2px) } to { opacity: 1; transform: none } }
  </style>
</head>
<body class="h-full font-sans text-slate-200 antialiased">
  <!-- ================================================================ header -->
  <header class="sticky top-0 z-30 border-b border-ink-700/80 bg-ink-950/80 backdrop-blur">
    <div class="mx-auto flex max-w-[1600px] items-center gap-4 px-4 py-3">
      <div class="flex items-center gap-3">
        <div class="grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 text-sm font-bold">DD</div>
        <div>
          <div class="text-sm font-semibold tracking-tight">DeepDive</div>
          <div class="text-[11px] text-slate-400">Self-verifying multi-agent research · Agent Arena 2026 · Track 01</div>
        </div>
      </div>
      <div id="pills" class="ml-auto hidden flex-wrap items-center gap-2 text-[11px] md:flex"></div>
      <a href="/docs" class="rounded-md border border-ink-600 px-2.5 py-1 text-[11px] text-slate-300 hover:bg-ink-800">API docs</a>
    </div>
  </header>

  <div class="mx-auto grid max-w-[1600px] grid-cols-12 gap-4 p-4">
    <!-- ============================================================== sidebar -->
    <aside class="col-span-12 space-y-4 xl:col-span-3">
      <section class="panel p-4">
        <div class="panel-h mb-3">New research run</div>
        <textarea id="query" rows="4" maxlength="1000" placeholder="Ask a research question… e.g. How does the Reserve Bank of India use the repo rate to control inflation?"
          class="w-full resize-none rounded-lg border border-ink-600 bg-ink-900 p-3 text-sm placeholder:text-slate-500 focus:border-indigo-500 focus:outline-none"></textarea>
        <div id="presets" class="mt-2 flex flex-wrap gap-1.5"></div>
        <div class="mt-3 flex items-center gap-2">
          <label class="text-xs text-slate-400" for="iters">Max iterations</label>
          <select id="iters" class="rounded-md border border-ink-600 bg-ink-900 px-2 py-1 text-xs">
            <option>1</option><option>2</option><option selected>3</option><option>4</option>
          </select>
          <button id="runBtn" class="ml-auto rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-50">Run DeepDive</button>
        </div>
        <p id="runHint" class="mt-2 text-[11px] text-slate-500"></p>
      </section>

      <section class="panel p-4">
        <div class="mb-3 flex items-center">
          <div class="panel-h">Private documents</div>
          <label class="ml-auto cursor-pointer rounded-md border border-ink-600 px-2 py-1 text-[11px] hover:bg-ink-800">
            Upload PDF/TXT/MD<input id="fileInput" type="file" class="hidden" multiple accept=".pdf,.txt,.md,.markdown" />
          </label>
        </div>
        <div id="docs" class="max-h-48 space-y-1.5 overflow-auto scroll-thin text-xs text-slate-400">No documents uploaded.</div>
      </section>

      <section class="panel p-4">
        <div class="mb-3 flex items-center"><div class="panel-h">Recent runs</div>
          <button id="refreshRuns" class="ml-auto text-[11px] text-slate-400 hover:text-slate-200">refresh</button></div>
        <div id="runs" class="max-h-[420px] space-y-1.5 overflow-auto scroll-thin text-xs"></div>
      </section>
    </aside>

    <!-- ================================================================= main -->
    <main class="col-span-12 space-y-4 xl:col-span-9">
      <!-- LangGraph tracker -->
      <section class="panel p-4">
        <div class="mb-3 flex items-center gap-3">
          <div class="panel-h">LangGraph execution</div>
          <span id="runIdLabel" class="font-mono text-[11px] text-slate-500"></span>
          <span id="statusBadge" class="ml-auto rounded-full border border-ink-600 px-2.5 py-0.5 text-[11px] text-slate-400">idle</span>
        </div>
        <div class="relative">
          <div id="tracker" class="grid grid-cols-5 gap-3"></div>
          <svg class="pointer-events-none mt-1 h-10 w-full" viewBox="0 0 1000 40" preserveAspectRatio="none" aria-hidden="true">
            <path id="loopPath" d="M 700 2 C 700 38, 300 38, 300 2" fill="none" stroke="#3a4559" stroke-width="1.5" />
          </svg>
          <div class="-mt-3 text-center text-[11px] text-slate-500"><span id="loopLabel">route_verification · loop back if coverage &lt; 70% or grounding &lt; 75%</span></div>
        </div>
        <div id="routeLine" class="mt-3 min-h-[20px] font-mono text-[11px] text-slate-400"></div>
      </section>

      <!-- Metrics -->
      <section id="metrics" class="grid grid-cols-2 gap-3 md:grid-cols-4 2xl:grid-cols-8"></section>

      <!-- Tabs -->
      <section class="panel">
        <div class="flex flex-wrap items-center gap-1 border-b border-ink-700 px-3 pt-2" role="tablist" id="tabs"></div>
        <div class="p-4">
          <div data-panel="report"></div>
          <div data-panel="claims" class="hidden"></div>
          <div data-panel="contradictions" class="hidden"></div>
          <div data-panel="sources" class="hidden"></div>
          <div data-panel="audit" class="hidden"></div>
          <div data-panel="telemetry" class="hidden"></div>
          <div data-panel="followup" class="hidden"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Source inspector drawer -->
  <div id="drawerBackdrop" class="fixed inset-0 z-40 hidden bg-black/50"></div>
  <aside id="drawer" class="fixed right-0 top-0 z-50 hidden h-full w-full max-w-2xl overflow-auto border-l border-ink-700 bg-ink-900 p-5 scroll-thin"></aside>
  <div id="toast" class="fixed bottom-4 left-1/2 z-50 hidden -translate-x-1/2 rounded-lg border border-rose-500/40 bg-rose-950/90 px-4 py-2 text-sm text-rose-100"></div>

<script nonce="{{ csp_nonce }}">
'use strict';
const NODES = [
  { id: 'planner', label: 'Planner', sub: 'MECE sub-questions' },
  { id: 'researcher', label: 'Researcher', sub: 'Tavily · DDG · corpus · docs' },
  { id: 'drafter', label: 'Drafter', sub: 'cited [SRC] drafts' },
  { id: 'verifier', label: 'Verifier', sub: 'entailment · contradictions' },
  { id: 'synthesizer', label: 'Synthesizer', sub: 'verified report' },
];
const TABS = [
  ['report', 'Report'], ['claims', 'Claim Matrix'], ['contradictions', 'Contradiction Radar'],
  ['sources', 'Sources'], ['audit', 'Audit Trail'], ['telemetry', 'Telemetry'], ['followup', 'Follow-up'],
];
const PRESETS = [
  'How much solar PV capacity was added globally in 2023, and what drove that growth?',
  'How does the Reserve Bank of India use the repo rate to control inflation, and what is its inflation target?',
  'What does current evidence say about microplastics in human blood and their health effects?',
  'Why is the Great Wall of China visible from the Moon with the naked eye?',
];
const VERDICT = {
  SUPPORTED: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30',
  CONTRADICTED: 'bg-rose-500/15 text-rose-300 border-rose-500/30',
  UNSUPPORTED: 'bg-amber-500/15 text-amber-300 border-amber-500/30',
};
const S = { runId: null, es: null, events: [], traces: [], run: null, claims: [], sources: [], docs: [], selectedDocs: new Set(),
            chat: [], nodeState: {}, iterations: {}, claimFilter: 'ALL', auditFilter: '', live: { claims: 0, supported: 0, contradictions: 0 } };

// ------------------------------------------------------------------ helpers
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = (v) => (v === null || v === undefined || Number.isNaN(v)) ? '—' : `${Math.round(v * 100)}%`;
const fmt = (n) => (n ?? 0).toLocaleString();
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), 5000); }
async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { const body = await res.json(); detail = body.detail || body.error?.message || detail; } catch (_) {}
    throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
  }
  const ctype = res.headers.get('content-type') || '';
  return ctype.includes('application/json') ? res.json() : res;
}
function cite(text) {
  return esc(text).replace(/\[((?:SRC-\d{3,4}(?:\s*[,;]\s*)?)+)\]/g, (_m, ids) =>
    ids.split(/\s*[,;]\s*/).filter(Boolean).map((id) => `<span class="chip" data-src="${id}">${id}</span>`).join(' '));
}
function tierBadge(tier) {
  const cls = { TIER_1: 'text-emerald-300 border-emerald-500/30', TIER_2: 'text-sky-300 border-sky-500/30', TIER_3: 'text-amber-300 border-amber-500/30' }[tier] || 'text-slate-400 border-ink-600';
  return `<span class="rounded border px-1.5 py-0.5 text-[10px] ${cls}">${esc((tier || '').replace('_', ' '))}</span>`;
}
function bar(v, color = 'bg-indigo-500') { return `<div class="h-1.5 w-full rounded bg-ink-700"><div class="h-1.5 rounded ${color}" style="width:${Math.round((v || 0) * 100)}%"></div></div>`; }
function empty(msg) { return `<div class="py-10 text-center text-sm text-slate-500">${esc(msg)}</div>`; }

// ------------------------------------------------------------------ static UI
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([id, label], i) =>
    `<button class="tab -mb-px border-b-2 border-transparent px-3 py-2 text-sm text-slate-400 hover:text-slate-200" role="tab" data-tab="${id}" aria-selected="${i === 0}">${label}<span class="ml-1.5 text-[10px] text-slate-500" data-count="${id}"></span></button>`).join('');
  $('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) selectTab(b.dataset.tab); });
}
function selectTab(id) {
  document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  document.querySelectorAll('[data-panel]').forEach((p) => p.classList.toggle('hidden', p.dataset.panel !== id));
}
function setCount(tab, n) { const el = document.querySelector(`[data-count="${tab}"]`); if (el) el.textContent = n ? n : ''; }
function renderTracker() {
  $('#tracker').innerHTML = NODES.map((n) => {
    const st = S.nodeState[n.id] || 'idle'; const it = S.iterations[n.id] || 0;
    return `<div class="node rounded-xl border border-ink-600 bg-ink-850 p-3" data-state="${st}">
      <div class="flex items-center gap-2"><span class="dot h-2 w-2 rounded-full bg-ink-500"></span>
        <span class="text-sm font-medium">${n.label}</span>${it > 1 ? `<span class="ml-auto rounded bg-violet-500/20 px-1.5 text-[10px] text-violet-300">×${it}</span>` : ''}</div>
      <div class="mt-1 text-[11px] text-slate-500">${n.sub}</div></div>`;
  }).join('');
}
function setStatus(status) {
  const b = $('#statusBadge');
  const cls = { running: 'border-indigo-500/50 text-indigo-300', pending: 'border-indigo-500/50 text-indigo-300', completed: 'border-emerald-500/50 text-emerald-300', failed: 'border-rose-500/50 text-rose-300' }[status] || 'border-ink-600 text-slate-400';
  b.className = `ml-auto rounded-full border px-2.5 py-0.5 text-[11px] ${cls}`; b.textContent = status;
}
function renderMetrics(m) {
  const cards = [
    ['Grounding', m ? `${pct(m.grounding_rate_pre)} → ${pct(m.grounding_rate_final)}` : (S.live.claims ? pct(S.live.supported / S.live.claims) : '—'), 'first draft → final'],
    ['Coverage', m ? pct(m.coverage_score) : '—', 'sub-questions answered'],
    ['Citation precision', m ? pct(m.citation_precision) : '—', 'cited claims entailed'],
    ['Quotes verified', m ? pct(m.quote_verification_rate) : '—', 'located verbatim'],
    ['Iterations', m ? `${m.iterations} (${m.loop_backs} loop)` : (S.iterations.researcher || '—'), 'research passes'],
    ['Claims kept / cut', m ? `${m.claims_in_report} / ${m.claims_removed}` : (S.live.claims ? `${S.live.claims} checked` : '—'), 'verified / stripped'],
    ['Contradictions', m ? m.contradictions : S.live.contradictions, 'quote-validated'],
    ['Mesh calls', m ? `${m.llm_calls} · ${fmt(m.total_tokens)} tok` : `${S.traces.length} · ${fmt(S.traces.reduce((a, t) => a + (t.total_tokens || 0), 0))} tok`, 'all via Mesh API'],
  ];
  $('#metrics').innerHTML = cards.map(([k, v, s]) => `<div class="panel px-3 py-2.5"><div class="text-[10px] uppercase tracking-wider text-slate-500">${k}</div>
    <div class="mt-1 text-lg font-semibold tabular-nums">${esc(v)}</div><div class="text-[10px] text-slate-500">${s}</div></div>`).join('');
}

// ------------------------------------------------------------------ health / docs / runs
async function loadHealth() {
  try {
    const h = await api('/api/health');
    const pill = (ok, label) => `<span class="rounded-full border px-2 py-0.5 ${ok ? 'border-emerald-500/40 text-emerald-300' : 'border-amber-500/40 text-amber-300'}">${esc(label)}</span>`;
    $('#pills').innerHTML = [
      pill(h.mesh_configured, h.mesh_configured ? `Mesh · ${h.config.default_model}` : 'Mesh key missing'),
      pill(true, `Search · ${h.search_providers.join(' → ')}`),
      pill(!!h.vector_store.dense, h.vector_store.dense ? 'Hybrid BM25 + Chroma' : 'BM25 index'),
    ].join('');
    if (!h.mesh_configured) { $('#runHint').textContent = 'Set MESH_API_KEY to enable research runs. Past runs remain browsable.'; }
  } catch (e) { toast(`Health check failed: ${e.message}`); }
}
async function loadDocs() {
  S.docs = await api('/api/documents');
  $('#docs').innerHTML = S.docs.length ? S.docs.map((d) => `<label class="flex items-center gap-2 rounded-md border border-ink-700 bg-ink-850 px-2 py-1.5">
      <input type="checkbox" data-doc="${esc(d.id)}" ${S.selectedDocs.has(d.id) ? 'checked' : ''} class="accent-indigo-500" />
      <span class="truncate text-slate-300">${esc(d.filename)}</span><span class="ml-auto shrink-0 text-[10px] text-slate-500">${fmt(d.char_count)} chars</span></label>`).join('')
    : 'No documents uploaded. Uploaded files are indexed with exact character spans and scored as user-supplied evidence.';
}
async function uploadDocs(files) {
  const fd = new FormData(); [...files].forEach((f) => fd.append('files', f));
  try { const out = await api('/api/documents', { method: 'POST', body: fd }); out.forEach((d) => S.selectedDocs.add(d.id)); await loadDocs(); }
  catch (e) { toast(`Upload failed: ${e.message}`); }
}
async function loadRuns() {
  const runs = await api('/api/runs?limit=30');
  $('#runs').innerHTML = runs.length ? runs.map((r) => `<button data-run="${esc(r.id)}" class="block w-full rounded-lg border ${r.id === S.runId ? 'border-indigo-500/60 bg-indigo-500/5' : 'border-ink-700 bg-ink-850'} px-2.5 py-2 text-left hover:border-ink-500">
      <div class="line-clamp-2 text-slate-300">${esc(r.query)}</div>
      <div class="mt-1 flex items-center gap-2 text-[10px] text-slate-500"><span class="${r.status === 'completed' ? 'text-emerald-400' : r.status === 'failed' ? 'text-rose-400' : 'text-indigo-300'}">${esc(r.status)}</span>
      ${r.grounding_rate !== null && r.grounding_rate !== undefined ? `<span>grounding ${pct(r.grounding_rate)}</span>` : ''}${r.iterations ? `<span>${r.iterations} it.</span>` : ''}<span class="ml-auto">${esc((r.created_at || '').slice(0, 16).replace('T', ' '))}</span></div></button>`).join('')
    : '<div class="text-slate-500">No runs yet.</div>';
}

// ------------------------------------------------------------------ run lifecycle
function resetRun(runId) {
  if (S.es) { S.es.close(); S.es = null; }
  Object.assign(S, { runId, events: [], traces: [], run: null, claims: [], sources: [], chat: [], nodeState: {}, iterations: {}, live: { claims: 0, supported: 0, contradictions: 0 } });
  $('#runIdLabel').textContent = runId || ''; $('#routeLine').textContent = ''; $('#loopPath').classList.remove('firing');
  renderTracker(); renderMetrics(null); renderAll();
}
async function startRun() {
  const query = $('#query').value.trim();
  if (query.length < 8) { toast('Please enter a research question (at least 8 characters).'); return; }
  $('#runBtn').disabled = true;
  try {
    const body = { query, max_iterations: Number($('#iters').value), document_ids: [...S.selectedDocs] };
    const res = await api('/api/research', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    await openRun(res.run_id);
  } catch (e) { toast(e.message); } finally { $('#runBtn').disabled = false; }
}
async function openRun(runId) {
  resetRun(runId);
  const run = await api(`/api/runs/${runId}`); S.run = run; setStatus(run.status);
  if (run.status === 'pending' || run.status === 'running') { connectStream(runId); }
  else { (await api(`/api/runs/${runId}/audit`)).forEach((e) => onAudit(e, false)); renderAudit(); await loadAll(); }
  loadRuns();
}
function connectStream(runId) {
  const es = new EventSource(`/api/runs/${runId}/stream`); S.es = es;
  es.addEventListener('audit', (m) => onAudit(JSON.parse(m.data), true));
  es.addEventListener('trace', (m) => { S.traces.push(JSON.parse(m.data)); renderMetrics(null); setCount('telemetry', S.traces.length); });
  es.addEventListener('done', async (m) => { es.close(); S.es = null; setStatus(JSON.parse(m.data).status); await loadAll(); loadRuns(); });
  es.onerror = () => { if (S.es === es && es.readyState === EventSource.CLOSED) toast('Live stream disconnected.'); };
}
function onAudit(ev, live) {
  S.events.push(ev);
  const t = ev.event_type;
  if (t === 'run_started') setStatus('running');
  if (t === 'node_started') { S.nodeState[ev.node] = 'active'; S.iterations[ev.node] = (S.iterations[ev.node] || 0) + 1; $('#loopPath').classList.remove('firing'); }
  if (t === 'node_completed') S.nodeState[ev.node] = 'done';
  if (t === 'run_failed') { Object.keys(S.nodeState).forEach((k) => { if (S.nodeState[k] === 'active') S.nodeState[k] = 'failed'; }); setStatus('failed'); toast(ev.message); }
  if (t === 'claim_verified') { S.live.claims += 1; if (ev.payload?.verdict === 'SUPPORTED') S.live.supported += 1; }
  if (t === 'contradiction_detected') S.live.contradictions += 1;
  if (t === 'route_decision') {
    const p = ev.payload || {};
    $('#routeLine').innerHTML = `iteration ${esc(p.iteration)}: coverage <b class="text-slate-200">${pct(p.coverage_score)}</b> (≥${pct(p.coverage_threshold)}) · grounding <b class="text-slate-200">${pct(p.grounding_rate)}</b> (≥${pct(p.grounding_threshold)}) → <span class="${p.route === 'researcher' ? 'text-violet-300' : 'text-emerald-300'}">${esc(p.route)}</span>`;
  }
  if (t === 'loop_back') { $('#loopPath').classList.add('firing'); $('#loopLabel').textContent = ev.message; }
  if (live) { renderTracker(); renderMetrics(null); appendAuditRow(ev); setCount('audit', S.events.length); }
}

async function loadAll() {
  const id = S.runId; if (!id) return;
  const [run, claims, sources, traces] = await Promise.all([
    api(`/api/runs/${id}`), api(`/api/runs/${id}/claims`), api(`/api/runs/${id}/sources`), api(`/api/runs/${id}/traces`),
  ]);
  if (id !== S.runId) return;
  Object.assign(S, { run, claims, sources, traces: traces.traces, traceSummary: traces.summary });
  if (run.status === 'completed') NODES.forEach((n) => { S.nodeState[n.id] = S.nodeState[n.id] || 'done'; });
  setStatus(run.status); renderTracker(); renderMetrics(run.report?.metrics || null); renderAll();
}

// ------------------------------------------------------------------ tab renderers
function renderAll() { renderReport(); renderClaims(); renderContradictions(); renderSources(); renderAudit(); renderTelemetry(); renderFollowup(); }

function renderReport() {
  const el = $('[data-panel="report"]'); const r = S.run?.report;
  if (!r) { el.innerHTML = empty(S.runId ? (S.run?.status === 'failed' ? `Run failed: ${S.run.error || 'see audit trail'}` : 'Report will appear when the Synthesizer finishes…') : 'Start a run or open a recent one.'); return; }
  el.innerHTML = `<div class="fade-in space-y-5">
    <div class="flex flex-wrap items-start gap-3"><div><div class="text-[11px] uppercase tracking-wider text-indigo-300">Verified executive report</div>
      <h2 class="mt-1 text-xl font-semibold tracking-tight">${esc(r.title)}</h2><div class="mt-1 text-xs text-slate-500">${esc(r.query)}</div></div>
      <a href="/api/runs/${esc(r.run_id)}/report.pdf" class="ml-auto rounded-lg border border-ink-600 px-3 py-1.5 text-xs hover:bg-ink-800">Export PDF</a></div>
    <div class="rounded-xl border border-ink-700 bg-ink-850 p-4 text-[15px] leading-relaxed">${cite(r.executive_summary)}</div>
    ${r.key_findings.length ? `<div><div class="panel-h mb-2">Key findings</div><ul class="space-y-1.5 text-sm">${r.key_findings.map((f) => `<li class="flex gap-2"><span class="mt-2 h-1 w-1 shrink-0 rounded-full bg-indigo-400"></span><span>${cite(f)}</span></li>`).join('')}</ul></div>` : ''}
    <div class="space-y-3">${r.sections.map((s) => `<div class="rounded-xl border border-ink-700 p-4">
      <div class="flex items-center gap-2"><span class="font-mono text-[10px] text-slate-500">${esc(s.sub_question_id)}</span><h3 class="text-sm font-semibold">${esc(s.heading)}</h3>
      <span class="ml-auto text-[10px] text-slate-500">${s.claim_ids.length} verified claims · conf ${Number(s.confidence).toFixed(2)}</span></div>
      <p class="mt-2 text-sm leading-relaxed text-slate-300">${cite(s.body)}</p></div>`).join('')}</div>
    ${r.limitations.length ? `<div><div class="panel-h mb-2">Limitations</div><ul class="list-disc space-y-1 pl-5 text-sm text-slate-400">${r.limitations.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></div>` : ''}
    ${r.guard_removed_sentences.length ? `<details class="text-xs text-slate-500"><summary class="cursor-pointer">Citation guard removed ${r.guard_removed_sentences.length} synthesized sentence(s)</summary><ul class="mt-2 list-disc pl-5">${r.guard_removed_sentences.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></details>` : ''}
  </div>`;
}

function renderClaims() {
  const el = $('[data-panel="claims"]'); setCount('claims', S.claims.length);
  if (!S.claims.length) { el.innerHTML = empty(S.runId ? 'Claims appear once the Verifier has run.' : 'No run selected.'); return; }
  const its = [...new Set(S.claims.map((c) => c.iteration))].sort();
  const rows = S.claims.filter((c) => S.claimFilter === 'ALL' || (S.claimFilter === 'REPORT' ? c.included_in_report : c.verdict === S.claimFilter));
  const counts = (v) => S.claims.filter((c) => c.verdict === v).length;
  el.innerHTML = `<div class="mb-3 flex flex-wrap items-center gap-2 text-xs">${['ALL', 'SUPPORTED', 'CONTRADICTED', 'UNSUPPORTED', 'REPORT'].map((f) =>
      `<button data-cf="${f}" class="rounded-md border px-2.5 py-1 ${S.claimFilter === f ? 'border-indigo-500 text-indigo-200' : 'border-ink-600 text-slate-400'}">${f === 'REPORT' ? 'In report' : f.toLowerCase()} ${f in VERDICT ? `(${counts(f)})` : ''}</button>`).join('')}
    <span class="ml-auto text-slate-500">${S.claims.length} claims across iteration(s) ${its.join(', ')}</span></div>
    <div class="overflow-auto scroll-thin"><table class="w-full text-left text-xs"><thead class="text-[10px] uppercase tracking-wider text-slate-500"><tr>
      <th class="py-2 pr-3">Claim</th><th class="pr-3">It.</th><th class="pr-3">Verdict</th><th class="w-24 pr-3">Confidence</th><th class="pr-3">Evidence span</th><th>Report</th></tr></thead>
    <tbody class="divide-y divide-ink-700">${rows.map((c) => `<tr class="align-top">
      <td class="max-w-sm py-2 pr-3"><div class="font-mono text-[10px] text-slate-500">${esc(c.claim_id)} · ${esc(c.sub_question_id)}</div><div class="text-slate-200">${esc(c.claim_text)}</div>
        <div class="mt-1 flex flex-wrap gap-1">${(c.cited_source_ids || []).map((s) => `<span class="chip" data-src="${esc(s)}">${esc(s)}</span>`).join('') || '<span class="text-[10px] text-rose-300">no citation</span>'}</div></td>
      <td class="pr-3 text-slate-400">${c.iteration}</td>
      <td class="pr-3"><span class="rounded border px-1.5 py-0.5 text-[10px] font-medium ${VERDICT[c.verdict] || ''}">${esc(c.verdict)}</span>${c.downgraded ? '<div class="mt-1 text-[10px] text-amber-300">downgraded</div>' : ''}</td>
      <td class="pr-3"><div class="mb-1 tabular-nums text-slate-400">${Number(c.confidence).toFixed(2)}</div>${bar(c.confidence)}</td>
      <td class="max-w-md pr-3 text-slate-400">${c.evidence_quote ? `<div class="italic text-slate-300">“${esc(c.evidence_quote)}”</div>` : ''}
        <div class="mt-1 text-[10px]">${c.evidence_source_id ? `<span class="chip" data-src="${esc(c.evidence_source_id)}">${esc(c.evidence_source_id)}</span> ` : ''}${c.quote_verified ? `<span class="text-emerald-400">✓ quote located [${c.evidence_char_start}:${c.evidence_char_end}]</span>` : '<span class="text-slate-500">quote not located</span>'}</div>
        ${c.downgrade_reason ? `<div class="mt-1 text-[10px] text-amber-300">${esc(c.downgrade_reason)}</div>` : ''}</td>
      <td>${c.included_in_report ? '<span class="text-emerald-400">✓</span>' : '<span class="text-slate-600">—</span>'}</td></tr>`).join('')}</tbody></table></div>`;
}

function renderContradictions() {
  const el = $('[data-panel="contradictions"]'); const items = S.run?.report?.contradictions || [];
  setCount('contradictions', items.length);
  if (!S.run?.report) { el.innerHTML = empty('The contradiction radar runs inside the Verifier on every iteration.'); return; }
  if (!items.length) { el.innerHTML = empty('No cross-source contradictions survived quote validation.'); return; }
  const sev = { high: 'border-rose-500/50 text-rose-300', medium: 'border-amber-500/50 text-amber-300', low: 'border-sky-500/50 text-sky-300' };
  el.innerHTML = `<div class="grid gap-3 lg:grid-cols-2">${items.map((c) => `<div class="fade-in rounded-xl border border-ink-700 bg-ink-850 p-4">
    <div class="flex items-center gap-2"><span class="font-mono text-[10px] text-slate-500">${esc(c.contradiction_id)}</span><span class="text-sm font-medium">${esc(c.topic)}</span>
      <span class="ml-auto rounded-full border px-2 py-0.5 text-[10px] uppercase ${sev[c.severity] || ''}">${esc(c.severity)}</span></div>
    <div class="mt-3 grid gap-2 text-xs md:grid-cols-2">
      <div class="rounded-lg border border-ink-600 p-2.5"><div class="mb-1">${c.source_a === 'DRAFT' ? '<span class="text-[10px] text-slate-400">Draft claim</span>' : `<span class="chip" data-src="${esc(c.source_a)}">${esc(c.source_a)}</span>`}</div><div class="text-slate-300">“${esc(c.statement_a)}”</div></div>
      <div class="rounded-lg border border-ink-600 p-2.5"><div class="mb-1"><span class="chip" data-src="${esc(c.source_b)}">${esc(c.source_b)}</span></div><div class="text-slate-300">“${esc(c.statement_b)}”</div></div></div>
    ${c.explanation ? `<p class="mt-2 text-xs text-slate-400">${esc(c.explanation)}</p>` : ''}
    <p class="mt-2 text-[11px] text-indigo-300">${esc(c.resolution_hint)}</p></div>`).join('')}</div>`;
}

function renderSources() {
  const el = $('[data-panel="sources"]'); setCount('sources', S.sources.length);
  if (!S.sources.length) { el.innerHTML = empty('Sources appear as the Researcher indexes them.'); return; }
  const cited = new Set((S.run?.report?.sources || []).filter((s) => s.cited_in_report).map((s) => s.source_id));
  el.innerHTML = `<div class="overflow-auto scroll-thin"><table class="w-full text-left text-xs"><thead class="text-[10px] uppercase tracking-wider text-slate-500"><tr>
    <th class="py-2 pr-3">ID</th><th class="pr-3">Source</th><th class="pr-3">Tier</th><th class="w-28 pr-3">Authority</th><th class="pr-3">Rule</th><th class="pr-3">Retrieved via</th><th>Cited</th></tr></thead>
    <tbody class="divide-y divide-ink-700">${S.sources.map((s) => `<tr class="cursor-pointer hover:bg-ink-800/60" data-src="${esc(s.source_id)}">
      <td class="py-2 pr-3 font-mono text-indigo-300">${esc(s.source_id)}</td>
      <td class="max-w-md pr-3"><div class="truncate text-slate-200">${esc(s.title)}</div><div class="truncate text-[10px] text-slate-500">${esc(s.url)}</div></td>
      <td class="pr-3">${tierBadge(s.authority_tier)}</td>
      <td class="pr-3"><div class="mb-1 tabular-nums">${Number(s.authority_score).toFixed(2)}</div>${bar(s.authority_score, s.authority_score >= .85 ? 'bg-emerald-500' : s.authority_score >= .65 ? 'bg-sky-500' : 'bg-amber-500')}</td>
      <td class="pr-3 font-mono text-[10px] text-slate-500">${esc(s.authority_rule)}</td>
      <td class="pr-3 text-slate-400">${esc(s.retrieval_tier)}</td><td>${cited.has(s.source_id) ? '<span class="text-emerald-400">✓</span>' : '<span class="text-slate-600">—</span>'}</td></tr>`).join('')}</tbody></table></div>`;
}

function auditRowHtml(ev) {
  const color = /failed|error|warning|downgraded/.test(ev.event_type) ? 'text-amber-300' : ev.event_type === 'loop_back' ? 'text-violet-300' : /contradiction/.test(ev.event_type) ? 'text-rose-300' : 'text-slate-300';
  const ts = (ev.timestamp || ev.created_at || '').slice(11, 19);
  const payload = ev.payload && Object.keys(ev.payload).length ? `<pre class="mt-1 hidden max-h-64 overflow-auto rounded bg-ink-950 p-2 text-[10px] text-slate-400 scroll-thin">${esc(JSON.stringify(ev.payload, null, 2))}</pre>` : '';
  return `<div class="audit-row fade-in cursor-pointer border-b border-ink-800 py-1.5 font-mono text-[11px]" data-node="${esc(ev.node)}" data-type="${esc(ev.event_type)}">
    <span class="text-slate-600">${esc(ts)}</span> <span class="inline-block w-24 text-indigo-300">${esc(ev.node)}</span> <span class="inline-block w-40 text-slate-500">${esc(ev.event_type)}</span> <span class="${color}">${esc(ev.message)}</span>${payload}</div>`;
}
function renderAudit() {
  const el = $('[data-panel="audit"]'); setCount('audit', S.events.length);
  const types = [...new Set(S.events.map((e) => e.event_type))].sort();
  el.innerHTML = `<div class="mb-2 flex flex-wrap items-center gap-2 text-xs"><select id="auditType" class="rounded-md border border-ink-600 bg-ink-900 px-2 py-1"><option value="">all event types</option>${types.map((t) => `<option ${S.auditFilter === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
    <input id="auditSearch" placeholder="filter messages…" class="w-56 rounded-md border border-ink-600 bg-ink-900 px-2 py-1" /><span class="ml-auto text-slate-500">${S.events.length} events · click a row for its payload</span></div>
    <div id="auditLog" class="max-h-[560px] overflow-auto scroll-thin">${S.events.length ? S.events.map(auditRowHtml).join('') : empty('The audit trail streams here live.')}</div>`;
  $('#auditType').addEventListener('change', (e) => { S.auditFilter = e.target.value; filterAudit(); });
  $('#auditSearch').addEventListener('input', filterAudit); filterAudit();
}
function appendAuditRow(ev) {
  const log = $('#auditLog'); if (!log) return;
  if (S.events.length === 1) log.innerHTML = '';
  log.insertAdjacentHTML('beforeend', auditRowHtml(ev)); filterAudit(); log.scrollTop = log.scrollHeight;
}
function filterAudit() {
  const q = ($('#auditSearch')?.value || '').toLowerCase();
  document.querySelectorAll('.audit-row').forEach((r) => { r.classList.toggle('hidden', (S.auditFilter && r.dataset.type !== S.auditFilter) || (q && !r.textContent.toLowerCase().includes(q))); });
}

function renderTelemetry() {
  const el = $('[data-panel="telemetry"]'); setCount('telemetry', S.traces.length);
  if (!S.traces.length) { el.innerHTML = empty('Every Mesh API call is traced here with latency and token usage.'); return; }
  const per = {}; S.traces.forEach((t) => { const a = per[t.agent_name] ||= { calls: 0, tokens: 0, latency: 0, repaired: 0 }; a.calls++; a.tokens += t.total_tokens || 0; a.latency += t.latency_ms || 0; a.repaired += t.status === 'repaired' ? 1 : 0; });
  const maxTok = Math.max(...Object.values(per).map((a) => a.tokens), 1);
  el.innerHTML = `<div class="grid gap-4 lg:grid-cols-2"><div><div class="panel-h mb-2">Per agent</div><table class="w-full text-xs"><thead class="text-[10px] uppercase text-slate-500"><tr><th class="py-1 text-left">Agent</th><th>Calls</th><th>Repaired</th><th>Avg ms</th><th class="w-1/3 text-left">Tokens</th></tr></thead><tbody class="divide-y divide-ink-700">
    ${Object.entries(per).map(([k, a]) => `<tr><td class="py-1.5 text-indigo-300">${esc(k)}</td><td class="text-center">${a.calls}</td><td class="text-center">${a.repaired}</td><td class="text-center tabular-nums">${Math.round(a.latency / a.calls)}</td><td><div class="tabular-nums">${fmt(a.tokens)}</div>${bar(a.tokens / maxTok)}</td></tr>`).join('')}</tbody></table></div>
    <div><div class="panel-h mb-2">Call log (latest 60)</div><div class="max-h-80 overflow-auto scroll-thin font-mono text-[10.5px]">${S.traces.slice(-60).reverse().map((t) => `<div class="flex gap-2 border-b border-ink-800 py-1"><span class="w-20 text-indigo-300">${esc(t.agent_name)}</span><span class="w-16 ${t.status === 'success' ? 'text-emerald-400' : 'text-amber-300'}">${esc(t.status)}</span><span class="truncate text-slate-500">${esc(t.model)}</span><span class="ml-auto tabular-nums text-slate-400">${t.latency_ms}ms · ${fmt(t.total_tokens)} tok${t.attempts > 1 ? ` · ${t.attempts} att.` : ''}</span></div>`).join('')}</div></div></div>`;
}

function renderFollowup() {
  const el = $('[data-panel="followup"]'); const ready = S.run?.status === 'completed';
  el.innerHTML = `<div class="flex h-[460px] flex-col"><div id="chatLog" class="flex-1 space-y-3 overflow-auto scroll-thin pr-1">
    ${S.chat.length ? S.chat.map((m) => m.role === 'user' ? `<div class="ml-auto max-w-[80%] rounded-xl bg-indigo-600/20 px-3 py-2 text-sm">${esc(m.text)}</div>`
      : `<div class="max-w-[85%] rounded-xl border border-ink-700 bg-ink-850 px-3 py-2 text-sm"><div>${cite(m.text)}</div><div class="mt-1 text-[10px] ${m.answerable ? 'text-emerald-400' : 'text-amber-300'}">${m.answerable ? `grounded in ${m.cited.join(', ')} · confidence ${Number(m.confidence).toFixed(2)}` : 'not answerable from this run’s evidence'}</div></div>`).join('')
      : empty(ready ? 'Ask a follow-up — answers are grounded strictly in this run’s verified evidence pool.' : 'Follow-up chat unlocks when a run completes.')}</div>
    <form id="chatForm" class="mt-3 flex gap-2"><input id="chatInput" ${ready ? '' : 'disabled'} placeholder="Ask about this run…" class="flex-1 rounded-lg border border-ink-600 bg-ink-900 px-3 py-2 text-sm disabled:opacity-50 focus:border-indigo-500 focus:outline-none" />
    <button ${ready ? '' : 'disabled'} class="rounded-lg bg-indigo-600 px-4 text-sm hover:bg-indigo-500 disabled:opacity-50">Ask</button></form></div>`;
  $('#chatForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const q = $('#chatInput').value.trim(); if (!q) return;
    S.chat.push({ role: 'user', text: q }); renderFollowup(); selectTab('followup');
    try {
      const history = S.chat.slice(-8).map((m) => ({ role: m.role, content: m.text }));
      const a = await api(`/api/runs/${S.runId}/followup`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q, history }) });
      S.chat.push({ role: 'assistant', text: a.answer, answerable: a.answerable, cited: a.cited_source_ids, confidence: a.confidence });
    } catch (err) { S.chat.push({ role: 'assistant', text: `Error: ${err.message}`, answerable: false, cited: [], confidence: 0 }); }
    renderFollowup(); selectTab('followup'); const log = $('#chatLog'); log.scrollTop = log.scrollHeight;
  });
}

// ------------------------------------------------------------------ source inspector
async function openSource(sid) {
  if (!S.runId) return;
  try {
    const src = await api(`/api/runs/${S.runId}/sources/${encodeURIComponent(sid)}`);
    const ranges = (src.verified_quotes || []).filter((q) => q.start !== null && q.end !== null).sort((a, b) => a.start - b.start);
    let html = ''; let cursor = 0; const text = src.content || '';
    for (const r of ranges) { if (r.start < cursor) continue; html += esc(text.slice(cursor, r.start)) + `<mark class="q-${esc(r.verdict)}" title="${esc(r.claim_id)}">${esc(text.slice(r.start, r.end))}</mark>`; cursor = r.end; }
    html += esc(text.slice(cursor));
    $('#drawer').innerHTML = `<div class="flex items-start gap-3"><div><div class="font-mono text-xs text-indigo-300">${esc(src.source_id)}</div><h3 class="mt-1 text-base font-semibold">${esc(src.title)}</h3>
      <a href="${esc(src.url.startsWith('http') ? src.url : '#')}" target="_blank" rel="noopener noreferrer" class="break-all text-xs text-slate-400 hover:text-slate-200">${esc(src.url)}</a></div>
      <button id="closeDrawer" class="ml-auto rounded-md border border-ink-600 px-2 py-1 text-xs">close</button></div>
      <div class="mt-3 flex flex-wrap items-center gap-2 text-xs">${tierBadge(src.authority_tier)}<span>authority ${Number(src.authority_score).toFixed(2)}</span><span class="font-mono text-[10px] text-slate-500">${esc(src.authority_rule)}</span><span class="text-slate-500">via ${esc(src.retrieval_tier)}</span></div>
      <div class="mt-2 text-[11px] text-slate-500">${src.evidence_spans.length} indexed span(s) · ${ranges.length} verified quote(s) highlighted by verdict</div>
      <div class="mt-4 whitespace-pre-wrap rounded-lg border border-ink-700 bg-ink-950 p-4 text-[13px] leading-relaxed text-slate-300">${html}</div>`;
    $('#drawer').classList.remove('hidden'); $('#drawerBackdrop').classList.remove('hidden');
    $('#closeDrawer').addEventListener('click', closeDrawer);
  } catch (e) { toast(e.message); }
}
function closeDrawer() { $('#drawer').classList.add('hidden'); $('#drawerBackdrop').classList.add('hidden'); }

// ------------------------------------------------------------------ wiring
document.addEventListener('click', (e) => {
  const chip = e.target.closest('[data-src]'); if (chip) { openSource(chip.dataset.src); return; }
  const run = e.target.closest('[data-run]'); if (run) { openRun(run.dataset.run); return; }
  const cf = e.target.closest('[data-cf]'); if (cf) { S.claimFilter = cf.dataset.cf; renderClaims(); return; }
  const row = e.target.closest('.audit-row'); if (row) { row.querySelector('pre')?.classList.toggle('hidden'); }
});
document.addEventListener('change', (e) => { const d = e.target.closest('[data-doc]'); if (d) { d.checked ? S.selectedDocs.add(d.dataset.doc) : S.selectedDocs.delete(d.dataset.doc); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && document.activeElement === $('#query')) startRun(); });
$('#drawerBackdrop').addEventListener('click', closeDrawer);
$('#runBtn').addEventListener('click', startRun);
$('#refreshRuns').addEventListener('click', loadRuns);
$('#fileInput').addEventListener('change', (e) => uploadDocs(e.target.files));
$('#presets').innerHTML = PRESETS.map((p, i) => `<button data-preset="${i}" class="rounded-md border border-ink-600 px-2 py-0.5 text-[10.5px] text-slate-400 hover:border-indigo-500 hover:text-slate-200">${esc(p.split(' ').slice(0, 5).join(' '))}…</button>`).join('');
$('#presets').addEventListener('click', (e) => { const b = e.target.closest('[data-preset]'); if (b) $('#query').value = PRESETS[Number(b.dataset.preset)]; });

renderTabs(); resetRun(null); loadHealth(); loadDocs().catch(() => {}); loadRuns().catch(() => {});
const initial = new URLSearchParams(location.search).get('run'); if (initial) openRun(initial).catch((e) => toast(e.message));
</script>
</body>
